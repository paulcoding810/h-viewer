name: Publish to Play Store

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Play Store track"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate key.properties
        run: |
          echo "$KEY_PROPERTIES" > key.properties
          chmod 600 key.properties
        env:
          KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode Play Store service account
        run: echo "$PLAY_STORE_JSON_KEY" > play-store-key.json
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Build Release AAB
        run: ./gradlew bundleGplayRelease


      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: gplay-release.aab
          path: app/build/outputs/bundle/gplayRelease/*.aab

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.paulcoding.hviewer
          releaseFiles: app/build/outputs/bundle/gplayRelease/*.aab
          track: ${{ github.event.inputs.track }}
          status: draft