name: Publish to Play Store

on:
#  workflow_dispatch:
#    inputs:
#      track:
#        description: "Play Store track"
#        required: true
#        default: "internal"
#        type: choice
#        options:
#          - internal
#          - alpha
#          - beta
#          - production
  push:
    branches:
      - feat/*
jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: generate key.properties
        run: echo ${{ secrets.KEY_PROPERTIES }} > key.properties

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Decode Play Store service account
        run: echo "$PLAY_STORE_JSON_KEY" > play-store-key.json
        env:
          PLAY_STORE_JSON_KEY: ${{ secrets.PLAY_STORE_JSON_KEY }}

      - name: Build Release AAB
        run: ./gradlew bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-store-key.json
          packageName: com.paulcoding.hviewer
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal
#          track: ${{ github.event.inputs.track }}